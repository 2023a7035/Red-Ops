{% extends "base.html" %}

{% block title %}404 - Not Found – RedOps{% endblock %}

{% block content %}
<div style="text-align:center; padding:80px 20px;">
    <div style="font-size:72px; font-weight:900; color:var(--accent-cyan); font-family:var(--font-mono); text-shadow:0 0 20px rgba(0, 240, 255, 0.4);">404</div>
    <h2 style="font-size:24px; color:#fff; margin-bottom:12px;">Security Vector / Resource Not Found</h2>
    <p style="color:var(--text-muted); max-width:480px; margin:0 auto 24px;">The specified resource coordinate does not exist or has been quarantined by policy.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Executive Dashboard</a>
</div>
{% endblock %}

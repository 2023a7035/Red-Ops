version: '3.8'

networks:
  redops-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

services:
  # 1. Edge Perimeter Gateway (Reverse Proxy)
  redops-gateway:
    image: nginx:1.18-alpine
    container_name: redops-gateway
    hostname: gw01.corp.internal
    networks:
      redops-net:
        ipv4_address: 172.28.0.10
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    environment:
      - TZ=UTC

  # 2. Enterprise Core Application Server (Spring/Tomcat)
  redops-app:
    image: tomcat:9.0-jdk11-openjdk-slim
    container_name: redops-app
    hostname: app-portal.corp.internal
    networks:
      redops-net:
        ipv4_address: 172.28.0.20
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    environment:
      - TZ=UTC

  # 3. Internal Cluster Database (PostgreSQL & Redis)
  redops-db:
    image: postgres:12-alpine
    container_name: redops-db
    hostname: db-cluster01.corp.internal
    networks:
      redops-net:
        ipv4_address: 172.28.0.30
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_PASSWORD=RedopsSecureDbPass2026!
      - POSTGRES_USER=redops_admin
      - POSTGRES_DB=corp_production
    restart: unless-stopped

  # 4. Domain Controller / Directory Simulation
  redops-dc:
    image: alpine:3.18
    container_name: redops-dc
    hostname: dc01.corp.internal
    networks:
      redops-net:
        ipv4_address: 172.28.0.40
    command: /bin/sh -c "while true; do sleep 3600; done"
    restart: unless-stopped
